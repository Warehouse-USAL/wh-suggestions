name: CI

on:
  pull_request:
    branches:
      - develop
      - master
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-drafts:
    name: Skip draft PRs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Not a draft
        run: echo "PR is ready for review — proceeding with CI"

  validate-branch:
    name: Validate branch model
    needs: skip-drafts
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Branch: $BRANCH"
          if ! echo "$BRANCH" | grep -qE '^(feature|fix|enhancement|refactor|hotfix|beta|backport|dependabot)/'; then
            echo "ERROR: Branch '$BRANCH' does not match naming conventions."
            echo "Expected prefix: feature/, fix/, enhancement/, refactor/, hotfix/, beta/, backport/, dependabot/"
            exit 1
          fi
          echo "Branch name is valid."

      - name: Enforce GitFlow flow (which branches may target which)
        run: |
          HEAD="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"
          echo "Flow: $HEAD -> $BASE"
          # master (production) is only updated through the release process:
          #   beta/*  (release candidate) or hotfix/* (production urgency).
          if [ "$BASE" = "master" ]; then
            case "$HEAD" in
              beta/*|hotfix/*) echo "OK: release path into master." ;;
              *) echo "ERROR: only beta/* or hotfix/* may target master. Day-to-day work (feature/enhancement/fix) goes to develop."; exit 1 ;;
            esac
          # develop receives all day-to-day work plus automated PRs.
          elif [ "$BASE" = "develop" ]; then
            case "$HEAD" in
              feature/*|enhancement/*|fix/*|refactor/*|hotfix/*|backport/*|dependabot/*) echo "OK: into develop." ;;
              *) echo "ERROR: '$HEAD' may not target develop."; exit 1 ;;
            esac
          fi


  code-quality:
    name: Code Quality (gofmt + go vet)
    needs: skip-drafts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "ERROR: these files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test-coverage:
    name: Test & Coverage
    needs: skip-drafts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out ./internal/...

      - name: Enforce coverage floor
        run: |
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Total coverage: ${TOTAL}%"
          awk -v t="$TOTAL" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t+0 >= f+0) ? 0 : 1 }' \
            || { echo "ERROR: coverage ${TOTAL}% is below the ${COVERAGE_FLOOR}% floor"; exit 1; }
        env:
          COVERAGE_FLOOR: '90'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build binary
    needs: [code-quality, test-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: CGO_ENABLED=0 go build -o bin/wh-suggestions ./cmd/wh-suggestions

      - name: Build Docker image (no push)
        run: docker build -t wh-suggestions:ci .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: wh-suggestions-bin
          path: bin/wh-suggestions
